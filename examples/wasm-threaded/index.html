<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Zenoh WASM Threaded Runtime Test</title>
  <style>
    body { font-family: monospace; background: #111; color: #0f0; padding: 20px; }
    #output p { margin: 2px 0; }
    .fail { color: #f00; }
    .pass { color: #0f0; }
  </style>
</head>
<body>
  <h2>Zenoh WASM Threaded Runtime Test</h2>
  <div id="output"></div>
  <script src="./pkg/zenoh_wasm_threaded_test.js"></script>
  <script>
    async function run() {
      await wasm_bindgen('./pkg/zenoh_wasm_threaded_test_bg.wasm');
      wasm_bindgen.run_threaded_test();
    }
    run().catch(e => {
      document.getElementById('output').innerHTML += '<p class="fail">Fatal: ' + e + '</p>';
      console.error(e);
    });
  </script>
</body>
</html>
