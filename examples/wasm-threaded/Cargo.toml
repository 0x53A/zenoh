[workspace]

[package]
name = "zenoh-wasm-threaded-test"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
zenoh = { path = "../../zenoh", default-features = false, features = ["transport_ws"] }
zenoh-runtime = { path = "../../commons/zenoh-runtime", features = ["wasm-threads"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "console",
  "Document",
  "Element",
  "HtmlElement",
  "Window",
] }
