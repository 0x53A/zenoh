[target.x86_64-unknown-linux-musl]
rustflags = "-Ctarget-feature=-crt-static"

[target.aarch64-unknown-linux-musl]
rustflags = "-Ctarget-feature=-crt-static"

[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']

# For wasm-threads builds, use:
# RUSTFLAGS='--cfg getrandom_backend="wasm_js" -Ctarget-feature=+atomics,+bulk-memory,+mutable-globals' \
#   cargo build -Zbuild-std=std,panic_abort --target wasm32-unknown-unknown --features wasm-threads
