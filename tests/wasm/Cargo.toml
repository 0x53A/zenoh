[workspace]

[package]
name = "zenoh-wasm-tests"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
zenoh = { path = "../../zenoh", default-features = false, features = ["transport_ws"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "Window"] }
futures-lite = "2"
